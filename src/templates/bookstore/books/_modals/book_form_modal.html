{# Modal de formulário para Book — gerado automaticamente #}
<div class="modal fade" id="bookModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="bookModalTitle">Novo Livros</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="bookForm">
          <input type="hidden" id="bookId">
                    <div class="row mb-3">
            <label for="title" class="col-sm-3 col-form-label">Title</label>
            <div class="col-sm-9">
              <input type="text" class="form-control" id="title" name="title">
            </div>
          </div>
          <div class="row mb-3 fk-field" data-field="author_id" data-foreign-table="authors">
            <label class="col-sm-3 col-form-label">Author Id</label>
            <div class="col-sm-9">
              <input type="hidden" name="author_id" class="fk-hidden-id">
              <div class="input-group">
                <input type="text" class="form-control fk-search-input" placeholder="Digite para buscar..." autocomplete="off">
                <button class="btn btn-outline-secondary fk-clear-btn" type="button" title="Limpar">
                  <i class="bi bi-x"></i>
                </button>
              </div>
              <div class="invalid-feedback">Selecione um valor válido.</div>
            </div>
          </div>
          <div class="row mb-3">
            <label for="isbn" class="col-sm-3 col-form-label">Isbn</label>
            <div class="col-sm-9">
              <input type="text" class="form-control" id="isbn" name="isbn">
            </div>
          </div>
          <div class="row mb-3">
            <label for="publisher" class="col-sm-3 col-form-label">Publisher</label>
            <div class="col-sm-9">
              <input type="text" class="form-control" id="publisher" name="publisher">
            </div>
          </div>
          <div class="row mb-3">
            <label for="year" class="col-sm-3 col-form-label">Year</label>
            <div class="col-sm-9">
              <input type="text" class="form-control" id="year" name="year">
            </div>
          </div>
          <div class="row mb-3">
            <label for="edition" class="col-sm-3 col-form-label">Edition</label>
            <div class="col-sm-9">
              <input type="text" class="form-control" id="edition" name="edition">
            </div>
          </div>
          <div class="row mb-3">
            <label for="genre" class="col-sm-3 col-form-label">Genre</label>
            <div class="col-sm-9">
              <input type="text" class="form-control" id="genre" name="genre">
            </div>
          </div>
          <div class="row mb-3">
            <label for="description" class="col-sm-3 col-form-label">Description</label>
            <div class="col-sm-9">
              <input type="text" class="form-control" id="description" name="description">
            </div>
          </div>
          <div class="row mb-3">
            <label for="cover_url" class="col-sm-3 col-form-label">Cover Url</label>
            <div class="col-sm-9">
              <input type="text" class="form-control" id="cover_url" name="cover_url">
            </div>
          </div>
          <div class="row mb-3">
            <label for="language" class="col-sm-3 col-form-label">Language</label>
            <div class="col-sm-9">
              <input type="text" class="form-control" id="language" name="language">
            </div>
          </div>
          <div class="row mb-3">
            <label for="quantity" class="col-sm-3 col-form-label">Quantity</label>
            <div class="col-sm-9">
              <input type="text" class="form-control" id="quantity" name="quantity">
            </div>
          </div>
          <div class="row mb-3">
            <label for="available" class="col-sm-3 col-form-label">Available</label>
            <div class="col-sm-9">
              <input type="text" class="form-control" id="available" name="available">
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" id="btnSaveBook">Salvar</button>
      </div>
    </div>
  </div>
</div>

<script>
  (function() {
    const initializedFields = new WeakSet();

    function setupForeignKeyField(container) {
      if (initializedFields.has(container)) return; // evita listeners duplicados
      initializedFields.add(container);

      const fieldName    = container.dataset.field;
      const foreignTable = container.dataset.foreignTable;
      const hiddenInput  = container.querySelector('.fk-hidden-id');
      const searchInput  = container.querySelector('.fk-search-input');
      const clearBtn     = container.querySelector('.fk-clear-btn');

      // Cria dropdown de resultados
      const dropdown = document.createElement('ul');
      dropdown.className = 'fk-dropdown list-group position-absolute w-100 shadow';
      dropdown.style.cssText = 'z-index:9999;max-height:200px;overflow-y:auto;display:none;';
      container.querySelector('.input-group').style.position = 'relative';
      container.querySelector('.input-group').appendChild(dropdown);

      function showDropdown(results) {
        dropdown.innerHTML = '';
        if (!results.length) {
          dropdown.style.display = 'none';
          return;
        }
        results.forEach(opt => {
          const li = document.createElement('li');
          li.className = 'list-group-item list-group-item-action';
          li.style.cursor = 'pointer';
          li.textContent = opt.text;
          li.addEventListener('mousedown', (e) => {
            e.preventDefault(); // evita blur antes do click
            hiddenInput.value = opt.id;
            searchInput.value = opt.text;
            dropdown.style.display = 'none';
          });
          dropdown.appendChild(li);
        });
        dropdown.style.display = 'block';
      }

      clearBtn.addEventListener('click', () => {
        searchInput.value  = '';
        hiddenInput.value  = '';
        dropdown.style.display = 'none';
        searchInput.focus();
      });

      searchInput.addEventListener('blur', () => {
        // Fecha dropdown ao perder foco (após mousedown já executou)
        setTimeout(() => { dropdown.style.display = 'none'; }, 150);
      });

      let debounceTimer;
      let currentController = null;

      searchInput.addEventListener('input', (e) => {
        hiddenInput.value = ''; // limpa seleção anterior ao redigitar
        clearTimeout(debounceTimer);
        const query = e.target.value.trim();
        if (query.length < 2) { dropdown.style.display = 'none'; return; }
        debounceTimer = setTimeout(async () => {
          if (currentController) currentController.abort();
          currentController = new AbortController();
          try {
            const url = `/api/options/${foreignTable}?search=${encodeURIComponent(query)}`;
            const response = await fetch(url, { signal: currentController.signal });
            const data = await response.json();
            showDropdown(data.results || []);
          } catch (err) {
            if (err.name !== 'AbortError') console.error('Erro FK fetch:', err);
          }
        }, 300);
      });
    }

    // Função global para preencher campo FK ao editar registro existente
    window.setForeignKeyValue = function(modalId, fieldName, id, text) {
      const modal = document.getElementById(modalId);
      if (!modal) return;
      const container = modal.querySelector(`.fk-field[data-field="${fieldName}"]`);
      if (!container) return;
      const hidden = container.querySelector('.fk-hidden-id');
      const search = container.querySelector('.fk-search-input');
      if (hidden) hidden.value = id   || '';
      if (search) search.value = text || '';
    };

    const modalElement = document.getElementById('bookModal');
    if (modalElement) {
      modalElement.addEventListener('shown.bs.modal', function() {
        modalElement.querySelectorAll('.fk-field').forEach(setupForeignKeyField);
      });
      // Limpa campos ao fechar
      modalElement.addEventListener('hidden.bs.modal', function() {
        modalElement.querySelectorAll('.fk-hidden-id, .fk-search-input').forEach(el => {
          el.value = '';
        });
        modalElement.querySelectorAll('.fk-dropdown').forEach(el => {
          el.style.display = 'none';
        });
      });
    }
  })();
</script>
