    requires_permission: "admin"

  - name: "Usuários e Papéis"
    endpoint: "admin_roles.index"
    icon: "bi-shield-lock"
    parent: "Administração"
    requires_permission: "admin"

  - name: "Histórico de Versões"
    endpoint: "snapshot_viewer.index"
    icon: "bi-clock-history"
